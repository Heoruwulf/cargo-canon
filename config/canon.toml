# ==============================================================================
# Canon Configuration (config/canon.toml or ~/.config/canon/canon.toml)
# ==============================================================================

[daemon]
# Daemon Infrastructure & Service Controls
system_daemon = true
lazy_indexing = true
idle_ttl_secs = 7200
enable_file_watcher = true
workspace_logging = true
# global_socket = "/run/user/1000/canon/daemon.sock"
# log_dir = "~/.local/state/canon/logs"

# ==============================================================================
# Project 1: Polyglot Rust + TypeScript Fullstack Monorepo
# ==============================================================================

[acme-web]
qualified_path = "/workspace/projects/acme-web"
has_worktrees = true
has_custom_worktree_path = "/workspace/projects/acme-web/.claude/worktrees"
lang = "rust,typescript"
codebase_scale = "massive"
default_format = "markdown"

# Per-Project Monitored Paths and Exclusions
watch_paths = ["crates", "frontend/src"]
ignored_dirs = [".claude", ".cursor", ".idea", ".vscode"]

# Per-Project Slicing Options
max_call_depth = 2
strip_comments = false
include_private_types = true
custom_ignored_dirs = ["node_modules", "target", "dist", "build"]

# Per-Project TypeScript Engine
[acme-web.typescript]
enabled = true
tsconfig_path = "frontend/tsconfig.json"
extensions = ["ts", "tsx", "js", "jsx"]
strip_jsx = true
strip_hook_bodies = true

# Per-Project Cross-Boundary Contract Correlation
[acme-web.cross_boundary]
rust_models = "crates/shared-types/src"
ts_types = "frontend/src/types"
strict_casing_check = true
strict_omitempty_check = true
strict_nil_slice_check = true

# Per-Project Verification & Simulation Oracles
[acme-web.simulate]
default_seeds = 5000
timeout_seconds = 30
panic_hook = "capture_backtrace"

[acme-web.verify]
default_unwind = 4
solver = "kissat"

[acme-web.diff_fuzz]
default_iterations = 50000
corpus_dir = "tests/fuzz/corpus"

# ==============================================================================
# Project 2: High-Performance Pure Go Backend Service
# ==============================================================================

[payment-gateway]
qualified_path = "/workspace/projects/payment-gateway"
has_worktrees = false
lang = "go"
codebase_scale = "medium"
default_format = "markdown"

watch_paths = ["backend", "pkg", "cmd"]
ignored_dirs = ["vendor"]

max_call_depth = 3
strip_comments = true
include_private_types = false

# Per-Project Go Engine
[payment-gateway.go]
enabled = true
module_root = "backend"
extensions = ["go"]
strip_function_bodies = true
index_implicit_interfaces = true
include_private_types = false

[payment-gateway.go.concurrency]
race_detector = true
goleak_check = true
gomaxprocs_sweep = [1, 2, 4, 8]
default_passes = 100

[payment-gateway.go.state_machine]
fuzz_transitions = 100000
seed = "0x1337C0DECAFEE00D"

[payment-gateway.cross_boundary]
go_models = "backend/pkg/models"
strict_casing_check = true
strict_omitempty_check = true
strict_nil_slice_check = true
