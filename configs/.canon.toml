# Canon Configuration Template (.canon.toml)
# Place this file in your repository root to configure cargo-canon.

[general]
# Codebase scale hint: "small", "medium", or "massive"
# Adjusts internal buffer pools, worker threads, and memory allocations.
codebase_scale = "massive"

# Default output format: "markdown", "json", or "text"
default_format = "markdown"

[slice]
# Maximum call-graph depth for caller/callee exploration (default: 2)
max_call_depth = 2

# Whether to strip comments during skeleton unparsing
strip_comments = false

# Whether to include private/internal types in context exports
include_private_types = true

[simulate]
# Default number of pseudo-random simulation passes to run
default_seeds = 5000

# Execution timeout per simulation pass in seconds
timeout_seconds = 30

# Panic capture mode: "capture_backtrace", "silent", or "abort"
panic_hook = "capture_backtrace"

[verify]
# Default loop unwinding depth bound for bounded model checking
default_unwind = 4

# SAT/SMT solver engine ("kissat", "cadical", or "z3")
solver = "kissat"

[diff_fuzz]
# Default number of differential fuzzing cycles
default_iterations = 50000

# Directory path for seed corpus storage
corpus_dir = "tests/fuzz/corpus"

[daemon]
# Unix domain socket path override (optional; auto-derived per workspace/worktree if omitted)
# socket_path = "/tmp/canon.sock"

# Enable background incremental file watching via notify
enable_file_watcher = true

# Paths to monitor for source modifications (.rs, .ts, .tsx, .js, .jsx, .go)
watch_paths = ["crates", "frontend/src", "backend"]

[typescript]
# Enable TypeScript and TSX context slicing via oxc_parser
enabled = true

# Path to tsconfig.json for module resolution
tsconfig_path = "frontend/tsconfig.json"

# Supported file extensions for slicing and daemon watcher
extensions = ["ts", "tsx", "js", "jsx"]

# Strips JSX elements down to clean interface signatures
strip_jsx = true

# Strips React hook internals (useEffect, useState) to signatures
strip_hook_bodies = true

[go]
# Enable Go context slicing via tree-sitter-go and implicit interface resolver
enabled = true

# Root directory for Go modules or monorepo root
module_root = "backend"

# Supported Go file extensions for slicing and daemon watcher
extensions = ["go"]

# Strip function and method bodies to /* implementation omitted */
strip_function_bodies = true

# Compute implicit interface satisfaction matrix: M(T) and M(*T) method sets
index_implicit_interfaces = true

# Include unexported (lowercase) types and helpers
include_private_types = false

[go.concurrency]
# Tier 1: Zero-refactor concurrency race detector (TSan)
race_detector = true

# Inspect goroutine stack traces at test teardown for abandoned goroutines
goleak_check = true

# Randomized GOMAXPROCS values to maximize concurrency jitter
gomaxprocs_sweep = [1, 2, 4, 8]

# Default number of simulation passes
default_passes = 100

[go.state_machine]
# Tier 2: Pure Sans-I/O discrete-event state machine fuzzer transitions
fuzz_transitions = 100000

# 64-bit seed for 100% deterministic failure replay
seed = "0x1337C0DECAFEE00D"

[cross_boundary]
# Directory containing shared Rust Serde models
rust_models = "crates/shared-types/src"

# Directory containing TypeScript interface contracts
ts_types = "frontend/src/types"

# Directory containing Go backend models
go_models = "backend/pkg/models"

# Enforce camelCase vs snake_case naming verification
strict_casing_check = true

# Enforce omitempty zero-value discrepancy validation
strict_omitempty_check = true

# Enforce nil slice vs empty slice serialization consistency (null vs [])
strict_nil_slice_check = true

