name: Ground-Truth Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Verification Oracles & Ground-Truth
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
        if: hashFiles('**/*.go') != ''

      - name: Install cargo-canon
        run: cargo install cargo-canon

      - name: Run Sans-I/O State Machine Transition Fuzzer & Matrix (Rust & Go)
        run: |
          cargo canon state-machine --matrix --fuzz-transitions --transitions 500000
          if [ -n "$(find . -name '*.go' -not -path './.*' | head -n 1)" ]; then
            cargo canon state-machine --lang go --transitions 500000
          fi

      - name: Run Deterministic Simulation Testing (DST & Go Concurrency Sweep)
        run: |
          cargo canon simulate --seeds 5000 --ai-prompt-on-fail
          if [ -n "$(find . -name '*.go' -not -path './.*' | head -n 1)" ]; then
            cargo canon simulate --lang go --seeds 100 --ai-prompt-on-fail
          fi

      - name: Run Differential Fuzzing
        run: cargo canon diff-fuzz --iterations 50000

      - name: Run Bounded Model Checking
        run: cargo canon verify --unwind 4
